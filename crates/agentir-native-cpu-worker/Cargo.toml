[package]
name = "agentir-native-cpu-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
agentir-core = { path = "../agentir-core" }
agentir-runtime-native-cpu = { path = "../agentir-runtime-native-cpu" }
cranelift-codegen.workspace = true
cranelift-frontend.workspace = true
cranelift-jit.workspace = true
cranelift-module.workspace = true
cranelift-native.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
agentir-backend-cpu = { path = "../agentir-backend-cpu" }
agentir-protocol = { path = "../agentir-protocol" }
agentir-store = { path = "../agentir-store" }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
result_large_err = "allow"
too_many_lines = "allow"
